# Reference: DPC4-ChampSim/replacement/drrip
name: drrip
doc: >
  Dynamic RRIP: set dueling between SRRIP insertion (MAX-1) and BRRIP insertion
  (MAX, every 32nd fill at MAX-1), arbitrated by a per-CPU saturating PSEL counter.

state:
  - name: rrpv
    scope: per_line
    kind: counter
    width: 2
    init: ZERO
  - name: psel
    scope: per_cpu
    kind: saturating
    width: 10
    init: MID
  - name: brrip_ctr
    scope: global
    kind: counter
    width: 6
    init: ZERO

victim:
  key: rrpv
  extremum: max
  tie_break: first
  on_search: age_to_max

duel:
  selector: psel
  arm_a:                  # SRRIP
    set: {rrpv: {const: MAX_MINUS_1}}
  arm_b:                  # BRRIP
    set:
      rrpv:
        default: {const: MAX}
        counter: brrip_ctr
        every_n: 32
        then: {const: MAX_MINUS_1}
  leader_a_category: 1
  leader_b_category: 0
  leader_a_delta: 1
  leader_b_delta: -1
  follower_uses_b_when: {counter: psel, cmp: gt, threshold: MAX_OVER_2}  # 512 > 511: followers start on BRRIP

on_fill:
  - when: {type_in: [WRITE]}
    set: {rrpv: {const: MAX_MINUS_1}}
    stop: true
  - use_duel: true

on_hit:
  - when: {type_in: [WRITE]}
    set: {rrpv: {const: MAX_MINUS_1}}
    stop: true
  - set: {rrpv: {const: ZERO}}
