name: mockingjay_lite
doc: >
  Mockingjay Lite: Compresses ETR to 4 bits (-7..7) and increases aging granularity
  to 12 accesses (matching baseline's 88-access TTL with 84), saving 6 KB. This
  allows the RDP table to quadruple to 8192 entries, drastically reducing aliasing.
  Sampler uses 256 sets and 9 ways to reduce conflict misses, and guards on_replace
  with an age threshold of 73 to prevent false RDP increments from sampler conflicts.
state:
  - name: etr
    scope: per_line
    kind: signed
    width: 4
    init: 0
  - name: etr_clock
    scope: per_set
    kind: counter
    width: 4
    init: 12
  - name: set_clock
    scope: per_set
    kind: counter
    width: 8
    init: ZERO
victim:
  key: etr
  extremum: max_magnitude
  tie_break: prefer_negative
  on_search: none
  bypass_when:
    - {table: {table: rdp, index: pc_sig, cmp: gt, threshold: 73}}
    - {table_exceeds_victim: {table: rdp, index: pc_sig, div: 12}}
signatures:
  - name: pc_sig
    source: ip
    fold: [hit, prefetch]
    hash: crc3
    low_bits: 13
tables:
  - name: rdp
    scope: global
    kind: saturating
    entries: 8192
    width: 7
    max: 95
    unset: true
samplers:
  - name: sampled_cache
    scope: global
    sets: {mirror: 32}
    extra_index_bits: 3
    ways: 9
    tag_bits: 10
    fields:
      - {name: signature, kind: counter, width: 13, init: ZERO}
      - {name: timestamp, kind: counter, width: 8, init: ZERO}
    age: {clock: set_clock, stamp: timestamp}
    victim: {key: age, extremum: max, tie_break: first, prefer_free: true}
    on_match:
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        stop: true
      - when: {type_in: [PREFETCH]}
        train: {table: rdp, index: signature, op: toward, sample: age, scale: 2, min_diff: 16}
        free: true
        stop: true
      - train: {table: rdp, index: signature, op: toward, sample: age, min_diff: 16}
        free: true
    sweep:
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        train: {table: rdp, index: signature, op: increment}
        free: true
    on_replace:
      - when: {counter: {counter: age, cmp: gt, threshold: 73}}
        train: {table: rdp, index: signature, op: increment}
    install: {signature: {signature: pc_sig}, timestamp: {read: set_clock}}
    after:
      - set: {set_clock: {add: 1}}
procedures:
  access:
    - sample: sampled_cache
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 12}}
      each_way:
        except_touched: true
        when: {counter: {counter: etr, cmp: lt, threshold: 7, abs: true}}
        set: {etr: {add: -1}}
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 12}}
      set: {etr_clock: {const: 0}}
    - set: {etr_clock: {add: 1}}
    - when: {table: {table: rdp, index: pc_sig, cmp: absent}}
      set: {etr: {const: 0}}
      stop: true
    - when: {table: {table: rdp, index: pc_sig, cmp: gt, threshold: 73}}
      set: {etr: {const: 7}}
      stop: true
    - set: {etr: {table: rdp, index: pc_sig, div: 12}}
on_hit:
  - when: {type_in: [WRITE]}
    stop: true
  - run: access
on_fill:
  - when: {type_in: [WRITE]}
    set: {etr: {const: -7}}
    stop: true
  - run: access
