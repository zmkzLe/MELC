name: your_policy_name
doc: >
  One line saying what changed and why.
state:
  - name: example_field
    scope: per_line
    kind: counter
    width: 2
    init: ZERO
victim:
  key: example_field
  extremum: max
  tie_break: first
  on_search: none
on_hit:
  - set: {example_field: {const: ZERO}}
on_fill:
  - set: {example_field: {const: MAX_MINUS_1}}
