- name: line_addr
  place: SignatureSource
  params: {}
  means: >
    The line address of the current access (the address without its 6 offset bits),
    as a 64-bit unsigned integer.

- name: is_bypassed
  place: condition
  params: {}
  means: >
    True if the current event is a fill and the fill was bypassed (i.e., way equals NUM_WAY).

- name: is_not_bypassed
  place: condition
  params: {}
  means: >
    True if the current event is a fill and the fill was NOT bypassed (i.e., way is less than NUM_WAY).

- name: filter_allows_bypass
  place: condition
  params: {filter_table: table, line_idx: signature}
  means: >
    True when the entry in filter_table at line_idx is equal to 0. False otherwise.