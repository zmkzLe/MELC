- name: train_agile
  place: step
  params: {table: table, index: signature, sample: state}
  means: >
    Reads the entry of the table at the index. If it is absent, sets it to the
    sample. Otherwise, calculates the difference between the entry and the sample.
    If the entry is greater than the sample by more than 12, subtracts 4 from the entry;
    if the entry is less than the sample by more than 12, adds 4 to the entry;
    otherwise, if the entry differs from the sample by at least 6, moves the entry
    1 step toward the sample. Finally, clamps the entry to 0 and the table's max,
    and writes it back.